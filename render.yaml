# Render Blueprint Specification File (render.yaml)
# Docs: https://render.com/docs/blueprint-spec

services:
  # CivicPulse Fullstack Web Service (FastAPI + React Unified Service)
  - type: web
    name: civicpulse-app
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./civicpulse.db
